    <rect x="117" y="122" width="22" height="60" rx="9" fill="url(#bar)"/>
    <rect x="56" y="164" width="14" height="34" rx="4" fill="url(#bar)"/>
    <rect x="76" y="148" width="14" height="50" rx="4" fill="url(#bar)"/>
