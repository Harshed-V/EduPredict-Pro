<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EduPredict AI favicon">
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="232" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#120D3B"/>
      <stop offset="1" stop-color="#0A0A26"/>
    </linearGradient>
    <linearGradient id="diamond" x1="61" y1="42" x2="195" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9EA5FF"/>
      <stop offset="1" stop-color="#6D73FF"/>
    </linearGradient>
    <linearGradient id="bar" x1="34" y1="145" x2="222" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8C93FF"/>
      <stop offset="1" stop-color="#5C63EA"/>
    </linearGradient>
    <linearGradient id="trend" x1="44" y1="188" x2="212" y2="162" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC92B"/>
      <stop offset="1" stop-color="#FFD94D"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.45 0 1 0 0 0.48 0 0 1 0 1 0 0 0 0.55 0" result="colored"/>
      <feMerge>
        <feMergeNode in="colored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="44" fill="url(#bg)"/>

  <circle cx="128" cy="86" r="70" fill="#4A43D9" opacity="0.12" filter="url(#softGlow)"/>

  <path d="M48 150H208" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <g filter="url(#glow)">
